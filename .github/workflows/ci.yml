name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # tmux-backed tests skip themselves when tmux is missing; install it so
      # they actually run.
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi

      # tmux's option set varies by version, and the desk-level tests care.
      - name: tmux version
        run: tmux -V

      - name: test
        run: go test -race ./...

      # Drives a real manager in a private tmux server: the desk-level
      # regressions (tabs, digit keys, confirmations, notifications) only show
      # up here.
      - name: end-to-end
        run: go test -tags e2e -timeout 10m ./internal/e2e/

      - name: build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    # The tools and the Go release train drift in BOTH directions: the day a
    # new Go ships, staticcheck's release can't read its export data yet; the
    # day staticcheck requires that new Go, a pinned older toolchain can't
    # build it. GOTOOLCHAIN=auto lets each tool pull the toolchain it asks
    # for, while the module under analysis keeps declaring its own in go.mod.
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
