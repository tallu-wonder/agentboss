<text x="20.0" y="66.9" fill="#00afaf" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600"> ☰ </text>
<text x="53.6" y="66.9" fill="#5fafff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="62.0" y="66.9" fill="#808080" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· </text>
<text x="78.8" y="66.9" fill="#bcbcbc" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">payments refactor </text>
<text x="238.4" y="66.9" fill="#5fafff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="246.8" y="66.9" fill="#ffffff" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">◆ flaky login test </text>
<text x="414.8" y="66.9" fill="#87d787" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="423.2" y="66.9" fill="#ffd75f" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">● release notes </text>
<text x="566.0" y="66.9" fill="#87d787" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="574.4" y="66.9" fill="#e4e4e4" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">· PR sweep </text>
<text x="28.4" y="84.9" fill="#42b3c2" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">agentboss</text>
<text x="104.0" y="84.9" fill="#ff5f5f" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600"> ◆1</text>
<text x="129.2" y="84.9" fill="#ffd75f" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ●1</text>
<text x="305.6" y="84.9" fill="#9e9e9e" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⌥p commands </text>
<text x="406.4" y="84.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="102.9" fill="#42b3c2" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600"> Typing into: sidebar</text>
<text x="406.4" y="102.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="423.2" y="102.9" fill="#d0d0d0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Reading </text>
<text x="507.2" y="102.9" fill="#d0d0d0" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">payments/charge.ts</text>
<text x="20.0" y="120.9" fill="#808080" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────</text>
<text x="406.4" y="120.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="440.0" y="120.9" fill="#6c6c6c" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⎿  Read 214 lines · 3 call sites</text>
<text x="20.0" y="138.9" fill="#42b3c2" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600"> Commands</text>
<text x="406.4" y="138.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="156.9" fill="#c8ccd6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> &gt; </text>
<text x="45.2" y="156.9" fill="#12141c" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">S</text>
<text x="53.6" y="156.9" fill="#585858" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">earch commands…</text>
<text x="406.4" y="156.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="423.2" y="156.9" fill="#d0d0d0" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● The bug: </text>
<text x="515.6" y="156.9" fill="#ffd75f" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">retry()</text>
<text x="574.4" y="156.9" fill="#d0d0d0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> drops the</text>
<text x="406.4" y="174.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="414.8" y="174.9" fill="#d0d0d0" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   idempotency key on its second attempt,</text>
<text x="20.0" y="192.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">› new session                              ⌥n </text>
<text x="406.4" y="192.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="414.8" y="192.9" fill="#d0d0d0" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   so a gateway timeout can charge twice.</text>
<text x="20.0" y="210.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new session in a git worktree            ⌥W </text>
<text x="406.4" y="210.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="414.8" y="210.9" fill="#d0d0d0" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Two ways out:</text>
<text x="20.0" y="228.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  import past conversation                 ⌥i </text>
<text x="406.4" y="228.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="246.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  search sessions                          ⌥/ </text>
<text x="406.4" y="246.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="440.0" y="246.9" fill="#d0d0d0" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. Thread it through </text>
<text x="616.4" y="246.9" fill="#87d7ff" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">RetryContext</text>
<text x="20.0" y="264.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  needs attention view                     ⌥A </text>
<text x="406.4" y="264.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="440.0" y="264.9" fill="#d0d0d0" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. Pin it in the closure</text>
<text x="20.0" y="282.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  filter by agent or project               ⌥e </text>
<text x="406.4" y="282.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="300.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new group                                ⌥N </text>
<text x="406.4" y="300.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="423.2" y="300.9" fill="#d0d0d0" textLength="302.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Going with 1 — the closure version</text>
<text x="20.0" y="318.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  rename                                   ⌥r </text>
<text x="406.4" y="318.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="414.8" y="318.9" fill="#d0d0d0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   breaks on concurrent retries anyway.</text>
<text x="20.0" y="336.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move selected sessions to group          ⌥m </text>
<text x="406.4" y="336.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="354.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  select / deselect session                ⌥b </text>
<text x="406.4" y="354.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="423.2" y="354.9" fill="#6c6c6c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻ Editing charge.ts…</text>
<text x="20.0" y="372.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  select all visible sessions              ⌥B </text>
<text x="406.4" y="372.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="390.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move down                                ⌥J </text>
<text x="406.4" y="390.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="408.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move up                                  ⌥K </text>
<text x="406.4" y="408.9" fill="#00ffff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">│</text>
<text x="20.0" y="426.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  sort sessions                            ⌥s </text>
<text x="406.4" y="426.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="444.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  session info                             ⌥v </text>
<text x="406.4" y="444.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="462.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  show / hide row metrics                  ⌥t </text>
<text x="406.4" y="462.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="480.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open project folder                      ⌥f </text>
<text x="406.4" y="480.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="498.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open scratch folder                      ⌥F </text>
<text x="406.4" y="498.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="516.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  mute / unmute notifications              ⌥M </text>
<text x="406.4" y="516.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="534.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  choose group color                       ⌥c </text>
<text x="406.4" y="534.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="552.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  go to group header / fold group          ⌥h </text>
<text x="406.4" y="552.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="570.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  fold / unfold group                  ⌥space </text>
<text x="406.4" y="570.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="588.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  stop session                             ⌥z </text>
<text x="406.4" y="588.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="606.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  archive / remove from desk               ⌥x </text>
<text x="406.4" y="606.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="624.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  undo stop or archive                     ⌥u </text>
<text x="406.4" y="624.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="642.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  quit manager (agents keep running)       ⌥q </text>
<text x="406.4" y="642.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="660.9" fill="#c8ccd6" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  narrower sidebar                         ⌥&lt; </text>
<text x="406.4" y="660.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="406.4" y="678.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="696.9" fill="#9e9e9e" textLength="294.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ↑↓ choose · Enter run · Esc cancel</text>
<text x="406.4" y="696.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="406.4" y="714.9" fill="#808080" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
