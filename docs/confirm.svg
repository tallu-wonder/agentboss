<svg xmlns="http://www.w3.org/2000/svg" width="858" height="898" viewBox="0 0 858 898" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="18.0">
<title>agentboss</title>
<rect width="858" height="898" rx="10" fill="#12141c"/>
<g><circle cx="24" cy="20" r="5.5" fill="#ff5f57"/><circle cx="42" cy="20" r="5.5" fill="#febc2e"/><circle cx="60" cy="20" r="5.5" fill="#28c840"/><text x="429" y="25" fill="#6b7280" font-size="12" text-anchor="middle">agentboss</text></g>
<rect x="337.2" y="538.0" width="75.6" height="24.0" fill="#3a3a3a"/>
<rect x="434.4" y="538.0" width="64.8" height="24.0" fill="#3a3a3a"/>
<text x="24.0" y="74.6" fill="#585858" textLength="810.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">───────────────────────────────────────────────────────────────────────────</text>
<text x="34.8" y="122.6" fill="#d0d0d0" textLength="108.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Reading </text>
<text x="142.8" y="122.6" fill="#d0d0d0" textLength="194.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">payments/charge.ts</text>
<text x="56.4" y="146.6" fill="#6c6c6c" textLength="345.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⎿  Read 214 lines · 3 call sites</text>
<text x="34.8" y="194.6" fill="#d0d0d0" textLength="118.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● The bug: </text>
<text x="153.6" y="194.6" fill="#ffd75f" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">retry()</text>
<text x="229.2" y="194.6" fill="#d0d0d0" textLength="108.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> drops the</text>
<text x="24.0" y="218.6" fill="#d0d0d0" textLength="442.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   idempotency key on its second attempt,</text>
<text x="24.0" y="242.6" fill="#d0d0d0" textLength="442.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   so a gateway timeout can charge twice.</text>
<text x="24.0" y="266.6" fill="#d0d0d0" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Two ways out:</text>
<text x="56.4" y="314.6" fill="#d0d0d0" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. Thread it through </text>
<text x="283.2" y="314.6" fill="#87d7ff" textLength="129.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">RetryContext</text>
<text x="56.4" y="338.6" fill="#d0d0d0" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. Pin it in the closure</text>
<text x="88.8" y="362.6" fill="#42b3c2" textLength="669.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╭────────────────────────────────────────────────────────────╮</text>
<text x="34.8" y="386.6" fill="#d0d0d0" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Go</text>
<text x="88.8" y="386.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="386.6" fill="#d0d0d0" textLength="140.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">Stop session?</text>
<text x="747.6" y="386.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="24.0" y="410.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   br</text>
<text x="88.8" y="410.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="747.6" y="410.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="434.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="99.6" y="434.6" fill="#c8ccd6" textLength="648.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Stops the agent process. Conversation stays on the desk;   </text>
<text x="747.6" y="434.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="34.8" y="458.6" fill="#6c6c6c" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻ Ed</text>
<text x="88.8" y="458.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="99.6" y="458.6" fill="#c8ccd6" textLength="648.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Enter resumes it.                                          </text>
<text x="747.6" y="458.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="482.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="747.6" y="482.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="506.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="99.6" y="506.6" fill="#c8ccd6" textLength="648.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> payments refactor                                          </text>
<text x="747.6" y="506.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="530.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="747.6" y="530.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="554.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="337.2" y="554.6" fill="#42b3c2" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">[ Yes ]</text>
<text x="434.4" y="554.6" fill="#d0d0d0" textLength="64.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">[ No ]</text>
<text x="747.6" y="554.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="578.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="578.6" fill="#9e9e9e" textLength="280.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">y confirm · n / Esc cancel</text>
<text x="747.6" y="578.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="602.6" fill="#42b3c2" textLength="669.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╰────────────────────────────────────────────────────────────╯</text>
