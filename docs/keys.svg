<text x="28.4" y="174.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">o            </text>
<text x="137.6" y="174.9" fill="#6c6c6c" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open, keep focus here</text>
<text x="406.4" y="174.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="192.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">ctrl+\       </text>
<text x="137.6" y="192.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sidebar ⇄ session</text>
<text x="406.4" y="192.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="210.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">tab          </text>
<text x="137.6" y="210.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">focus the session</text>
<text x="406.4" y="210.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="228.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">[ ]          </text>
<text x="137.6" y="228.9" fill="#6c6c6c" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">prev / next session</text>
<text x="406.4" y="228.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="246.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">opt+[ opt+]  </text>
<text x="137.6" y="246.9" fill="#6c6c6c" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">same, from inside an agent</text>
<text x="406.4" y="246.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="264.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">1-9          </text>
<text x="137.6" y="264.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">n-th open session</text>
<text x="406.4" y="264.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
