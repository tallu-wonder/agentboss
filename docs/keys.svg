<text x="20.0" y="660.9" fill="#c8ccd6" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                                              │</text>
<text x="28.4" y="678.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">tmux prefix here: ctrl+q</text>
<text x="230.0" y="678.9" fill="#c8ccd6" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                     │</text>
<text x="28.4" y="696.9" fill="#6c6c6c" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">any key closes</text>
<text x="146.0" y="696.9" fill="#c8ccd6" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                               │</text>
<text x="28.4" y="714.9" fill="#6c6c6c" textLength="361.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↵ open · n new · i import · / find · ? keys</text>
<text x="389.6" y="714.9" fill="#c8ccd6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  │</text>
