<g><circle cx="24" cy="20" r="5.5" fill="#ff5f57"/><circle cx="42" cy="20" r="5.5" fill="#febc2e"/><circle cx="60" cy="20" r="5.5" fill="#28c840"/><text x="436" y="25" fill="#6b7280" font-size="12" text-anchor="middle">agentboss</text></g>
<rect x="20.0" y="54.0" width="33.6" height="18.0" fill="#262626"/>
<rect x="53.6" y="54.0" width="8.4" height="18.0" fill="#303030"/>
<rect x="62.0" y="54.0" width="16.8" height="18.0" fill="#303030"/>
<rect x="78.8" y="54.0" width="151.2" height="18.0" fill="#303030"/>
<rect x="230.0" y="54.0" width="8.4" height="18.0" fill="#262626"/>
<rect x="238.4" y="54.0" width="8.4" height="18.0" fill="#d70000"/>
<rect x="246.8" y="54.0" width="159.6" height="18.0" fill="#d70000"/>
<rect x="406.4" y="54.0" width="8.4" height="18.0" fill="#262626"/>
<rect x="414.8" y="54.0" width="8.4" height="18.0" fill="#303030"/>
<rect x="423.2" y="54.0" width="134.4" height="18.0" fill="#303030"/>
<rect x="557.6" y="54.0" width="8.4" height="18.0" fill="#262626"/>
<rect x="566.0" y="54.0" width="8.4" height="18.0" fill="#005f87"/>
<rect x="574.4" y="54.0" width="92.4" height="18.0" fill="#005f87"/>
<rect x="666.8" y="54.0" width="184.8" height="18.0" fill="#262626"/>
<text x="20.0" y="66.9" fill="#00afaf" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600"> ☰ </text>
<text x="53.6" y="66.9" fill="#5fafff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="62.0" y="66.9" fill="#808080" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· </text>
<text x="78.8" y="66.9" fill="#bcbcbc" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">payments refactor </text>
<text x="238.4" y="66.9" fill="#5fafff" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="246.8" y="66.9" fill="#ffffff" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">◆ flaky login test </text>
<text x="414.8" y="66.9" fill="#87d787" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="423.2" y="66.9" fill="#ffd75f" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">● release notes </text>
<text x="566.0" y="66.9" fill="#87d787" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▎</text>
<text x="574.4" y="66.9" fill="#e4e4e4" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">· PR sweep </text>
<text x="28.4" y="84.9" fill="#42b3c2" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">agentboss</text>
<text x="112.4" y="84.9" fill="#ff5f5f" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">◆1</text>
<text x="137.6" y="84.9" fill="#ffd75f" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">●1</text>
<text x="389.6" y="84.9" fill="#6c6c6c" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">? </text>
<text x="406.4" y="84.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="20.0" y="102.9" fill="#444444" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────────────────</text>
<text x="406.4" y="102.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="423.2" y="102.9" fill="#d0d0d0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Reading </text>
<text x="507.2" y="102.9" fill="#d0d0d0" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">payments/charge.ts</text>
<text x="28.4" y="120.9" fill="#42b3c2" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">keys</text>
<text x="406.4" y="120.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="440.0" y="120.9" fill="#6c6c6c" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⎿  Read 214 lines · 3 call sites</text>
<text x="406.4" y="138.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="156.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">enter        </text>
<text x="137.6" y="156.9" fill="#6c6c6c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open (wakes dormant)</text>
<text x="406.4" y="156.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="423.2" y="156.9" fill="#d0d0d0" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● The bug: </text>
<text x="515.6" y="156.9" fill="#ffd75f" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">retry()</text>
<text x="574.4" y="156.9" fill="#d0d0d0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> drops the</text>
<text x="28.4" y="174.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥o           </text>
<text x="137.6" y="174.9" fill="#6c6c6c" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">open, keep focus here</text>
<text x="406.4" y="174.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="414.8" y="174.9" fill="#d0d0d0" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   idempotency key on its second attempt,</text>
<text x="28.4" y="192.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">ctrl+\       </text>
<text x="137.6" y="192.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sidebar ⇄ session</text>
<text x="406.4" y="192.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="414.8" y="192.9" fill="#d0d0d0" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   so a gateway timeout can charge twice.</text>
<text x="28.4" y="210.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">tab          </text>
<text x="137.6" y="210.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">focus the session</text>
<text x="406.4" y="210.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="414.8" y="210.9" fill="#d0d0d0" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Two ways out:</text>
<text x="28.4" y="228.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥[ ⌥]        </text>
<text x="137.6" y="228.9" fill="#6c6c6c" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">prev / next — works anywhere</text>
<text x="406.4" y="228.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="246.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥1-⌥9        </text>
<text x="137.6" y="246.9" fill="#6c6c6c" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">n-th open session — anywhere</text>
<text x="406.4" y="246.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="440.0" y="246.9" fill="#d0d0d0" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. Thread it through </text>
<text x="616.4" y="246.9" fill="#87d7ff" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">RetryContext</text>
<text x="28.4" y="264.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥a           </text>
<text x="137.6" y="264.9" fill="#6c6c6c" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">next needing you — anywhere</text>
<text x="406.4" y="264.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="440.0" y="264.9" fill="#d0d0d0" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. Pin it in the closure</text>
<text x="28.4" y="282.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥/           </text>
<text x="137.6" y="282.9" fill="#6c6c6c" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">search</text>
<text x="406.4" y="282.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="300.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥n           </text>
<text x="137.6" y="300.9" fill="#6c6c6c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">new session</text>
<text x="406.4" y="300.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="423.2" y="300.9" fill="#d0d0d0" textLength="302.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Going with 1 — the closure version</text>
<text x="28.4" y="318.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥W           </text>
<text x="137.6" y="318.9" fill="#6c6c6c" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">new session in a git worktree</text>
<text x="406.4" y="318.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="414.8" y="318.9" fill="#d0d0d0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   breaks on concurrent retries anyway.</text>
<text x="28.4" y="336.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥i           </text>
<text x="137.6" y="336.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">import past conversation</text>
<text x="406.4" y="336.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="354.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥N ⌥r ⌥m     </text>
<text x="137.6" y="354.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">group / rename / regroup</text>
<text x="406.4" y="354.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="423.2" y="354.9" fill="#6c6c6c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻ Editing charge.ts…</text>
<text x="137.6" y="372.9" fill="#6c6c6c" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(also renames in the agent)</text>
<text x="406.4" y="372.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="390.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥J ⌥K        </text>
<text x="137.6" y="390.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reorder (or drag)</text>
<text x="406.4" y="390.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="408.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥s           </text>
<text x="137.6" y="408.9" fill="#6c6c6c" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sort: status/recent/name/dir</text>
<text x="406.4" y="408.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="426.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥v           </text>
<text x="137.6" y="426.9" fill="#6c6c6c" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">session info popup</text>
<text x="288.8" y="426.9" fill="#c8ccd6" textLength="126.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">              │</text>
<text x="28.4" y="444.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥f ⌥F        </text>
<text x="137.6" y="444.9" fill="#6c6c6c" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">its folder · scratchpad</text>
<text x="330.8" y="444.9" fill="#c8ccd6" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">         │</text>
<text x="28.4" y="462.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥M           </text>
<text x="137.6" y="462.9" fill="#6c6c6c" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">mute / unmute alerts</text>
<text x="305.6" y="462.9" fill="#c8ccd6" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">            │</text>
<text x="28.4" y="480.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">right-click  </text>
<text x="137.6" y="480.9" fill="#6c6c6c" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">context menu (rows &amp; tabs)</text>
<text x="356.0" y="480.9" fill="#c8ccd6" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">      │</text>
<text x="28.4" y="498.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥c           </text>
<text x="137.6" y="498.9" fill="#6c6c6c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cycle group color</text>
<text x="280.4" y="498.9" fill="#c8ccd6" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">               │</text>
<text x="28.4" y="516.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥spc         </text>
<text x="137.6" y="516.9" fill="#6c6c6c" textLength="252.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">collapse group (tab folds too)</text>
<text x="389.6" y="516.9" fill="#c8ccd6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  │</text>
<text x="28.4" y="534.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥&lt; ⌥&gt;        </text>
<text x="137.6" y="534.9" fill="#6c6c6c" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sidebar width</text>
<text x="246.8" y="534.9" fill="#c8ccd6" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                   │</text>
<text x="28.4" y="552.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥z           </text>
<text x="137.6" y="552.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">close tab, stays on desk</text>
<text x="339.2" y="552.9" fill="#c8ccd6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        │</text>
<text x="28.4" y="570.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥x           </text>
<text x="137.6" y="570.9" fill="#6c6c6c" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">close to old · in old: delete</text>
<text x="381.2" y="570.9" fill="#c8ccd6" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   │</text>
<text x="28.4" y="588.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥u           </text>
<text x="137.6" y="588.9" fill="#6c6c6c" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reopen what you just closed</text>
<text x="364.4" y="588.9" fill="#c8ccd6" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">     │</text>
<text x="28.4" y="606.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥q           </text>
<text x="137.6" y="606.9" fill="#6c6c6c" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">quit, sessions live on</text>
<text x="322.4" y="606.9" fill="#c8ccd6" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">          │</text>
<text x="20.0" y="624.9" fill="#c8ccd6" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                                              │</text>
<text x="28.4" y="642.9" fill="#4cd1e0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">⠙ working </text>
<text x="112.4" y="642.9" fill="#ff5f5f" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">◆ needs you</text>
<text x="204.8" y="642.9" fill="#c8ccd6" textLength="210.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                        │</text>
<text x="28.4" y="660.9" fill="#ffd75f" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● new </text>
<text x="78.8" y="660.9" fill="#6c6c6c" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· idle </text>
<text x="137.6" y="660.9" fill="#444444" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○ dormant</text>
<text x="213.2" y="660.9" fill="#c8ccd6" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                       │</text>
<text x="20.0" y="678.9" fill="#c8ccd6" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                                              │</text>
<text x="28.4" y="696.9" fill="#6c6c6c" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">bare letters never act — stray typing is safe</text>
<text x="406.4" y="696.9" fill="#c8ccd6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="714.9" fill="#6c6c6c" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↵ open · ⌥n new · ⌥i import · ⌥? keys</text>
<text x="339.2" y="714.9" fill="#c8ccd6" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        │</text>
</svg>