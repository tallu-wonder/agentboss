<text x="34.8" y="458.6" fill="#6c6c6c" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">✻ Ed</text>
<text x="88.8" y="458.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="458.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥A</text>
<text x="132.0" y="458.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  needs attention view                                   </text>
<text x="747.6" y="458.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="482.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="482.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥e</text>
<text x="132.0" y="482.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  filter by agent or project                             </text>
<text x="747.6" y="482.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="506.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="506.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥N</text>
<text x="132.0" y="506.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new group                                              </text>
<text x="747.6" y="506.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="530.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="530.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥r</text>
<text x="132.0" y="530.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  rename                                                 </text>
<text x="747.6" y="530.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="554.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="554.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥m</text>
<text x="132.0" y="554.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move selected sessions to group                        </text>
<text x="747.6" y="554.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="578.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="578.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥b</text>
<text x="132.0" y="578.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  select / deselect session                              </text>
<text x="747.6" y="578.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="602.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="602.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥B</text>
<text x="132.0" y="602.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  select all visible sessions                            </text>
<text x="747.6" y="602.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="626.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="626.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥J</text>
<text x="132.0" y="626.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move down                                              </text>
<text x="747.6" y="626.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="650.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="650.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥K</text>
<text x="132.0" y="650.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  move up                                                </text>
<text x="747.6" y="650.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="674.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="674.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥s</text>
<text x="132.0" y="674.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  sort sessions                                          </text>
<text x="747.6" y="674.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="698.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="698.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥v</text>
<text x="132.0" y="698.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  session info                                           </text>
<text x="747.6" y="698.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="722.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="722.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥t</text>
<text x="132.0" y="722.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  show / hide row metrics                                </text>
<text x="747.6" y="722.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="746.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="746.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥f</text>
<text x="132.0" y="746.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open project folder                                    </text>
<text x="747.6" y="746.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="770.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="770.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥F</text>
<text x="132.0" y="770.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open scratch folder                                    </text>
<text x="747.6" y="770.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="794.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="794.6" fill="#9e9e9e" textLength="129.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↑↓ 1–27 / 55</text>
<text x="747.6" y="794.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="818.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="818.6" fill="#9e9e9e" textLength="356.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↑↓ / PgUp PgDn scroll · Esc close</text>
<text x="747.6" y="818.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
