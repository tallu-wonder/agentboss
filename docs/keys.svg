<svg xmlns="http://www.w3.org/2000/svg" width="872" height="740" viewBox="0 0 872 740" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="14.0">
<title>agentboss</title>
