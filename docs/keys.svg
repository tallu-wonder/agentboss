<text x="28.4" y="336.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">i            </text>
<text x="137.6" y="336.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">import past conversation</text>
<text x="406.4" y="336.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="354.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">N r m        </text>
<text x="137.6" y="354.9" fill="#6c6c6c" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">group / rename / regroup</text>
<text x="406.4" y="354.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="137.6" y="372.9" fill="#6c6c6c" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(also renames in the agent)</text>
