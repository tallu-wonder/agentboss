<text x="28.4" y="390.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">J K, drag    </text>
<text x="137.6" y="390.9" fill="#6c6c6c" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reorder rows &amp; groups</text>
<text x="406.4" y="390.9" fill="#8cc265" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="28.4" y="408.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">s            </text>
<text x="137.6" y="408.9" fill="#6c6c6c" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">sort: status/recent/name/dir</text>
