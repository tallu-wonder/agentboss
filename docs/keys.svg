<text x="28.4" y="318.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">n            </text>
<text x="137.6" y="318.9" fill="#6c6c6c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">new session</text>
