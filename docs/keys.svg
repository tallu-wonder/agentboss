<text x="28.4" y="570.9" fill="#d0d0d0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">x            </text>
<text x="137.6" y="570.9" fill="#6c6c6c" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">close to old · in old: delete</text>
<text x="381.2" y="570.9" fill="#c8ccd6" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   │</text>
