<text x="110.4" y="194.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">Enter</text>
<text x="164.4" y="194.6" fill="#c8ccd6" textLength="583.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open / resume selected session                      </text>
<text x="747.6" y="194.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="24.0" y="218.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   id</text>
<text x="88.8" y="218.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="218.6" fill="#d0d0d0" textLength="32.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">Tab</text>
<text x="142.8" y="218.6" fill="#c8ccd6" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  focus session                                         </text>
<text x="747.6" y="218.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="24.0" y="242.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   so</text>
<text x="88.8" y="242.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="242.6" fill="#d0d0d0" textLength="64.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">Ctrl+\</text>
<text x="175.2" y="242.6" fill="#c8ccd6" textLength="572.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  switch keyboard focus                              </text>
<text x="747.6" y="242.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="24.0" y="266.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   Tw</text>
<text x="88.8" y="266.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="266.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥[ ⌥]</text>
<text x="164.4" y="266.6" fill="#c8ccd6" textLength="583.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  previous / next session                             </text>
<text x="747.6" y="266.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="290.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="290.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥1–⌥9</text>
<text x="164.4" y="290.6" fill="#c8ccd6" textLength="583.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  open session by tab number                          </text>
<text x="747.6" y="290.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="56.4" y="314.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1.</text>
<text x="88.8" y="314.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="314.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥a</text>
<text x="132.0" y="314.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  next session needing attention                         </text>
<text x="747.6" y="314.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="56.4" y="338.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2.</text>
<text x="88.8" y="338.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="338.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥p</text>
<text x="132.0" y="338.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  commands                                               </text>
<text x="747.6" y="338.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="362.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="362.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥n</text>
<text x="132.0" y="362.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new session                                            </text>
<text x="747.6" y="362.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="34.8" y="386.6" fill="#d0d0d0" textLength="43.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">● Go</text>
<text x="88.8" y="386.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="386.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥W</text>
<text x="132.0" y="386.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new session in a git worktree                          </text>
<text x="747.6" y="386.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="24.0" y="410.6" fill="#d0d0d0" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">   br</text>
<text x="88.8" y="410.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="110.4" y="410.6" fill="#d0d0d0" textLength="21.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="600">⌥i</text>
<text x="132.0" y="410.6" fill="#c8ccd6" textLength="615.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  import past conversation                               </text>
<text x="747.6" y="410.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
<text x="88.8" y="434.6" fill="#42b3c2" textLength="10.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text>
